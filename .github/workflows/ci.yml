name: verify

on:
  push:
  pull_request:

# TWO JOBS, AND WHY THEY ARE SPLIT.
#
# `verify` runs the whole suite on both platforms. `selftest` sabotages each of
# that suite's rows and proves it goes red. A green suite alone says nothing:
# this repo once shipped 14 green rows of which 8 could not fail, which is the
# defect the whole setup was rebuilt around.
#
# Rewritten from a blank page 2026-08-22 (machinery rebuild).
# A HOSTED RUNNER HAS NONE OF THE PIECES INSTALLED. verify.sh's "pieces on this
# machine" row probes the disk for every skill and binary INSTALL.md promises,
# which is a question only the owner's laptop can answer; here it would be red by
# construction. This variable is what tells it so.
#
# Set HERE, by the workflow that knows what its runner is, rather than inferred
# inside verify.sh from an ambient GITHUB_ACTIONS. That variable describes an
# execution context and not a bare machine: a self-hosted runner has the tools,
# and anything that exported it into a local pre-push would have silently turned
# off the one check that needs a real disk. Unset, the probes run and can fail.
#
# It does NOT switch the whole row off. Manifest grammar, the reconciliation
# against INSTALL.md's pieces table, and the rule that no identity is both
# current and retired are all answerable anywhere, and they run on both runners.
# The selftest job below overrides this with INSTALLED_PROBE_ROOTS, which is how
# the disk probes get exercised, green and red, on a runner that has nothing.
env:
  VERIFY_NO_LOCAL_TOOLS: "1"

jobs:
  # WHY BOTH PLATFORMS. Not to test different things per OS: the commands are
  # identical on purpose. It is that the SAME check behaves differently per OS,
  # and only running both reveals which. Learned from the leak scan, whose
  # hostname rules used a word-boundary escape that git grep on macOS silently
  # ignores: on the machine doing the committing those rules matched NOTHING,
  # while the Linux run stayed green. Several rows are platform-sensitive the
  # same way — the scans shell out to grep (BSD, GNU and git's own engine all
  # differ), the path extractors use `grep -oE` and `sed -E`, and the
  # bash-3.2 row is only a REAL test on macOS, whose /bin/bash is 3.2.
  verify:
    strategy:
      # Both platforms always report. Without this a macOS failure cancels the
      # Linux job, and the run shows one red X with no way to tell whether the
      # problem is the check or the platform: the exact ambiguity this exists
      # to remove.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # verify.sh shells to python3 for the settings.example.json parse row.
      # Do not rely on the runner image preinstalling it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # jq is what both guard hooks read their input with, so their tests skip
      # THEMSELVES without it, and a skipped test reports the same green as a
      # passing one. Ubuntu runners ship jq; macOS runners do not.
      - name: Install jq (macOS runners have none)
        if: runner.os == 'macOS'
        run: brew install jq

      # ubuntu-latest ships shellcheck; macos-latest does not. Without this the
      # macOS run records "shellcheck not installed" as a WARN, and WARN never
      # fails a build, so the gate would be quietly half-present on the very
      # platform this matrix was added to cover.
      - name: Install shellcheck (macOS runners have none)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      # vale is the prose linter behind the "vale prose lint" row. Same reasoning
      # as shellcheck above: absent, the row records WARN and WARN never fails a
      # build, so the check would be quietly missing on whichever runner lacks it.
      #
      # NOT `brew install vale` ON UBUNTU. Homebrew IS on the ubuntu-latest image
      # (Ubuntu2404-Readme.md, checked 2026-08-22: "Homebrew 6.0.17", location
      # /home/linuxbrew) but that same note says "Homebrew is pre-installed on
      # image but not added to PATH", so the bare command fails. The official
      # release tarball is one static Go binary, needs no shellenv eval, and
      # pins the version, so both runners are testing the same vale.
      - name: Install vale (macOS)
        if: runner.os == 'macOS'
        run: brew install vale

      - name: Install vale (Linux, official release tarball)
        if: runner.os == 'Linux'
        env:
          VALE_VERSION: 3.18.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          sudo tar -xzf /tmp/vale.tar.gz -C /usr/local/bin vale
          vale --version

      # jscpd is the copied-block half of the "dupe-check self-scan" row. Absent,
      # that row still passes, saying "repeated names only — jscpd absent": a true
      # label on a half-run check, and CI is the one place the other half has to
      # run. Both runners have node, so one npm install covers them.
      #
      # UNPINNED, DELIBERATELY. hooks/external-check.sh reads the name out of every
      # tracked install command and requires a matching row in hooks/externals.txt,
      # which declares `jscpd`; `jscpd@5.0.16` is a different string and reddens the
      # external-references row. INSTALL.md installs it unpinned for the same reason,
      # and hooks/dupe-check.sh reads the reported clone COUNT rather than the exit
      # status, so a minor version bump cannot silently change its verdict. Latest on
      # 2026-08-22, from `npm view jscpd version`: 5.0.16.
      - name: Install jscpd
        run: npm install -g jscpd

      # GITHUB_TOKEN raises the API limit from 60 requests/hour per shared
      # runner IP to 1000 per repository. Without it the external-reference row
      # flaps red on a busy hour, and a check that reddens for reasons
      # unrelated to the code is a check people learn to ignore. The script
      # treats 403 and 429 as "could not run" rather than "missing", so a flap
      # can never delete a real dependency; the token stops the flap.
      - name: Run verify.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash verify.sh

      # verify.sh reports WARN for a row it could not run, and WARN never fails
      # the build. That is right for a genuinely local-only row (the installed
      # pre-commit hook, which a CI checkout does not have) and wrong for
      # everything else: a suite that skips half its rows looks identical to one
      # that passes them. This asserts the platform-sensitive rows actually ran.
      #
      # The last two are here because the selftest job below is ubuntu-only, so
      # nothing else proves those rows still WORK on macOS. Their own
      # fail-closed counts are the backstop: an extractor matching nothing
      # reports zero references and goes red rather than reporting a clean sweep.
      - name: Assert the platform-sensitive rows actually ran
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          bash verify.sh > /tmp/verify.out 2>&1 || true
          for row in \
            "infra scan positive control" \
            "pre-commit scan positive control" \
            "tracked-content scan" \
            "setup.sh bash-3.2 clean" \
            "shellcheck" \
            "vale prose lint" \
            "external references" \
            "dangling references" \
            "README skills inventory" \
            "README outside-pieces count"
          do
            if ! grep -qF "$row" /tmp/verify.out; then
              echo "::error::verify.sh did not report '$row' on ${{ matrix.os }} — it did not run"
              cat /tmp/verify.out
              exit 1
            fi
            if grep -E '^WARN' /tmp/verify.out | grep -qF "$row"; then
              echo "::error::'$row' recorded WARN on ${{ matrix.os }} — it was skipped, and WARN cannot fail the build"
              cat /tmp/verify.out
              exit 1
            fi
          done
          echo "every platform-sensitive row ran on ${{ matrix.os }}"

  # Until 2026-08-21 nothing automatic ran this, while SHIP.md claimed CI did.
  # The job above proves verify.sh reports PASS; this one proves a PASS means
  # something. Either alone is decoration.
  #
  # UBUNTU ONLY, DELIBERATELY. What the job above tests is platform-sensitive.
  # What THIS tests is whether a row is wired to its own failure, which is a
  # property of the wiring, not the runner. It re-runs the whole suite once per
  # sabotage (measured 2026-08-21: ~43s a run; 2026-08-22, after verify.sh began
  # running its slow rows together: ~19s a run, 7m47s for the whole self-test
  # on a Mac), and macOS runners bill at ten times the rate for an assertion
  # that does not vary by platform.
  selftest:
    runs-on: ubuntu-latest
    # Well above the measured runtime and far below the 6h default: a self-test
    # that hangs should fail inside the hour, not hold a runner all day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The self-test runs verify.sh in full on every sabotage, so it needs
      # everything verify.sh needs. shellcheck is one of the rows it sabotages.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Same tarball as the verify job's Linux leg, and for the same reason:
      # Homebrew on this image is not on PATH. "vale prose lint" is one of the
      # rows this job sabotages, and a sabotage of a row that WARNed because its
      # tool is missing proves nothing at all.
      #
      # jscpd:ignore-start
      # The seven lines below are byte-identical to the verify job's Linux leg,
      # and the duplicate-scan row in verify.sh sees them. Two jobs in one
      # workflow cannot share a step without a composite action, and one action
      # file to hold seven lines of curl costs more to read than the copy does.
      # Both copies pin the same VALE_VERSION, so they move together or not at
      # all.
      - name: Install vale
        env:
          VALE_VERSION: 3.18.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          sudo tar -xzf /tmp/vale.tar.gz -C /usr/local/bin vale
          vale --version
      # jscpd:ignore-end

      # "dupe-check self-scan" is one of the rows this job sabotages, and its
      # copied-block half needs jscpd. Same pin as the verify job.
      - name: Install jscpd
        run: npm install -g jscpd

      # ONE run, teed to a file. A second step that re-ran the script to
      # summarise it would cost another full pass for a tally the first run
      # already printed.
      #
      # The script prints BROKEN for a row that stayed green under sabotage and
      # SKIP for one it could not exercise, and exits non-zero on BROKEN, so the
      # failure half rides on the exit status. SKIP is the half a green exit
      # hides: .git/hooks/pre-commit does not exist in a CI checkout, so that
      # case legitimately skips here, and a skipped case must never read as a
      # proved one.
      - name: Run verify-selftest.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          bash verify-selftest.sh 2>&1 | tee /tmp/selftest.out
          rc=${PIPESTATUS[0]}
          echo "--- cases not proved on this runner ---"
          grep -E '^(SKIP|BROKEN)' /tmp/selftest.out || echo "none: every case was exercised"
          exit "$rc"
