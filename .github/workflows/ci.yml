name: verify
on:
  push:
  pull_request:

# WHY TWO PLATFORMS AND NOT ONE.
#
# This ran on ubuntu-latest only, and that is how a dead check went unnoticed: the
# `\b` in the infra-leak scan's hostname rules matches NOTHING under git grep on
# macOS, so on the machine that actually does the committing those rules were
# silently off, while GNU grep on Linux honoured `\b` and the CI run stayed green.
# One metacharacter, failing open on one platform.
#
# The commands are identical on both runners on purpose. The point is not to test
# different things per OS — it is that the SAME check can behave differently per
# OS, and only running it on both reveals which. Several checks in verify.sh are
# platform-sensitive in exactly that way:
#
#   * the infra-leak scan and the pre-commit scan shell out to git grep / grep,
#     whose regex engines differ (BSD vs GNU, and git's own is a third).
#   * "setup.sh bash-3.2 clean" is only a REAL test on macOS, whose /bin/bash is
#     3.2. On Linux /bin/bash is 5.x and the check passes trivially.
#   * hooks/*.test.sh run under whatever /bin/bash the runner has.
#
# verify.sh needs no --os flag: it detects nothing and branches nowhere.
jobs:
  verify:
    strategy:
      # Both platforms always report. Without this a macOS failure cancels the
      # Linux job, and the run shows one red X with no way to tell whether the
      # problem is the check or the platform — the exact ambiguity this exists to
      # remove.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # verify.sh shells to python3 for the settings.example.json parse check.
      # Don't rely on the runner image preinstalling it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # jq is what both guard hooks read their input with, so their tests skip
      # themselves without it. A skipped test reports the same green as a passing
      # one, which is the failure this whole file exists to prevent. Ubuntu runners
      # ship jq; macOS runners do not.
      - name: Install jq (macOS runners have none)
        if: runner.os == 'macOS'
        run: brew install jq

      # ubuntu-latest ships shellcheck; macos-latest does not. Without this the
      # macOS run records "shellcheck not installed — skipped" as a WARN, and WARN
      # never fails the build — so the gate would be quietly half-present on the
      # platform this job was added to cover.
      - name: Install shellcheck (macOS runners have none)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      # GITHUB_TOKEN raises the API limit from 60 requests per hour PER SHARED RUNNER IP to
      # 1000 per repository. Without it the external-reference row would flap red on a busy
      # hour, and a check that goes red for reasons unrelated to the code is a check people
      # learn to ignore. The script treats 403 and 429 as "could not run" rather than
      # "missing", so a flap can never delete a real dependency; the token stops the flap.
      - name: Run verify.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash verify.sh

      # verify.sh reports WARN for a check it could not run, and WARN never fails
      # the build. That is right for a genuinely local-only check (the installed
      # pre-commit hook, which a CI checkout does not have) and wrong for everything
      # else: a suite that skips half its checks looks identical to one that passes
      # them. This asserts the platform-sensitive ones actually ran.
      - name: Assert the platform-sensitive checks actually ran
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          bash verify.sh > /tmp/verify.out 2>&1 || true

          # The two positive controls are the reason this matrix exists: they turn
          # "the scan found nothing" into "the scan can still find something". If
          # either is missing, the leak scan is back to being unfalsifiable here.
          #
          # The last two rows are here because the self-test job below runs on
          # ubuntu only, so nothing else proves those rows still WORK on macOS.
          # Both extract paths with `grep -oE` and `sed -E`, whose BSD and GNU
          # behaviour differ, which is exactly how the infra scan went blind on
          # one platform while staying green. Their own fail-closed counts are
          # the backstop: an extractor that matches nothing reports zero
          # references and goes red rather than reporting a clean sweep.
          for check in \
            "infra scan positive control" \
            "pre-commit scan positive control" \
            "tracked-content scan" \
            "setup.sh bash-3.2 clean" \
            "shellcheck" \
            "external references" \
            "dangling references" \
            "README skills inventory"
          do
            if ! grep -qF "$check" /tmp/verify.out; then
              echo "::error::verify.sh did not report '$check' on ${{ matrix.os }} — it did not run"
              cat /tmp/verify.out
              exit 1
            fi
            if grep -E '^WARN' /tmp/verify.out | grep -qF "$check"; then
              echo "::error::'$check' recorded WARN on ${{ matrix.os }} — it was skipped, and WARN cannot fail the build"
              cat /tmp/verify.out
              exit 1
            fi
          done
          echo "every platform-sensitive check ran on ${{ matrix.os }}"

  # WHY THIS JOB EXISTS.
  #
  # Until 2026-08-21 nothing automatic ran verify-selftest.sh. The job above proved
  # that verify.sh reports PASS; nothing proved a PASS meant anything. That is the
  # entire failure this repo was rebuilt around — it once shipped 14 green rows of
  # which 8 could not go red — and the self-test written to close it was reachable
  # only by a human typing it. SHIP.md line 198 said "verify.sh and verify-selftest.sh
  # are tracked and CI runs them" for weeks while this job did not exist.
  #
  # It sabotages each check in turn and asserts verify.sh goes red for that check,
  # restoring through an EXIT trap. A green verify.sh plus a green self-test is the
  # pair that means something; either alone does not.
  #
  # UBUNTU ONLY, DELIBERATELY. The job above runs on both platforms because the
  # checks it runs are platform-sensitive — regex engines differ, and stock macOS
  # bash is 3.2. What THIS job tests is different in kind: whether a check is wired
  # to its own failure, which is a property of the wiring and not of the runner. It
  # costs roughly 17 minutes because it re-runs the whole suite once per sabotage
  # (measured 2026-08-21: ~43s per verify.sh run, 23 cases), and macOS runners bill
  # at ten times the rate for an assertion that does not vary by platform.
  selftest:
    runs-on: ubuntu-latest
    # Well above the ~17 minutes measured, and far below the 6h default: a self-test
    # that hangs should fail the build inside the hour, not occupy a runner all day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The self-test runs verify.sh in full on every sabotage, so it needs
      # everything verify.sh needs. shellcheck is one of the checks it sabotages.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # ONE run, teed to a file. The obvious second step that re-runs the script to
      # summarise it costs another full 17 minutes for a tally that the first run
      # already printed.
      #
      # The self-test prints BROKEN for a check that stayed green under sabotage and
      # SKIP for one it could not exercise, and exits non-zero on BROKEN — so the
      # failure half is carried by the exit status. SKIP is the half a green exit
      # hides: .git/hooks/pre-commit does not exist in a CI checkout, so case 8c
      # legitimately skips here, and a skipped case must never read as a proved one.
      - name: Run verify-selftest.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          bash verify-selftest.sh 2>&1 | tee /tmp/selftest.out
          rc=${PIPESTATUS[0]}
          echo "--- cases not proved on this runner ---"
          grep -E '^(SKIP|BROKEN)' /tmp/selftest.out || echo "none: every case was exercised"
          exit "$rc"
