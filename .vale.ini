# Vale, the second prose check. docs/PROSE.md is the standard; this file and
# styles/NoYolo/ encode the part of it a program can decide.
#
# WHY TWO CHECKS AND NOT ONE. hooks/slop-block.sh fires on Write and Edit, so it
# only ever sees a file an agent just touched in this session. Vale runs over
# every tracked .md from verify.sh, so it reaches the files nobody edited today,
# the ones written before the hook existed, and the ones edited outside Claude.
# The two overlap on the long dash and the vocabulary count deliberately: same
# rule, two reaches. docs/PROSE.md stays the one place the meaning is written,
# and both mechanisms are transcriptions of it.
#
# Only rules docs/PROSE.md already states are here. A rule vale ships that the
# repo has not agreed to is noise, and a check that cries wolf gets switched off.

StylesPath = styles

# Warning, not error: everything in styles/NoYolo is a warning, and verify.sh
# treats any alert as a finding. Setting this to error would silence the lot.
MinAlertLevel = warning

# NO PACKAGES LINE, AND BOTH CANDIDATES WERE MEASURED BEFORE IT WAS LEFT OUT.
# Run 2026-08-22 over all 34 tracked .md files, NoYolo's own alerts excluded:
#
#   write-good  347 alerts: 234 Passive, 89 TooWordy, 11 Weasel, 7 ThereIs, 6 So.
#               docs/PROSE.md asks for none of those. A check that cries wolf
#               gets switched off, and 234 passive-voice notes is the wolf.
#   proselint     2 alerts, and both are false: SHIP.md's "old shit" is
#               deliberate, and docs/TESTING.md's "TODO" is the word used as a
#               noun in a sentence, not an annotation left behind. Zero true
#               positives on this corpus, against roughly a hundred rules the
#               repo has never agreed to. It buys nothing and can only misfire.
#
# Re-run the measurement before adding either back.

[*.md]
BasedOnStyles = NoYolo
