# docs/PROSE.md, "Sentence shapes that carry weight": close on the next action,
# named and specific, or close on nothing.
#
# The three phrases hooks/slop-block.sh already greps for, plus the hedges that
# open the same kind of empty sentence. Vale's reach is what differs: the hook
# sees one file at write time, this sees every tracked .md on every verify run.
extends: existence
message: "'%s' names no next action. Name the action, or end."
level: warning
link: docs/PROSE.md
ignorecase: true
tokens:
  - feel free to (?:ask|reach)
  - let me know if you (?:need|have)
  - don'?t hesitate to
